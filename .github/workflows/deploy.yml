name: Deploy RakCloud Docs

on:
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build VitePress site
        run: npm run docs:build

      - name: Verify build output
        run: test -f docs/.vitepress/dist/index.html

      - name: Prepare SSH key and known_hosts
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY_B64 }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p 22 47.103.103.48 >> ~/.ssh/known_hosts

      - name: Deploy via rsync
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts" \
            docs/.vitepress/dist/ \
            root@47.103.103.48:/var/www/rakcloud-docs/

      - name: Verify deployment
        run: |
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://47.103.103.48/rakcloud-docs/)
          echo "status: $STATUS"
          [ "$STATUS" = "200" ]

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key
