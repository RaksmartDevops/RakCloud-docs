name: Build dist

# PR：只构建校验，不发布。
# push main / 手动触发：构建后把产物强制推送为孤立的 dist 分支，供文档服务器主动拉取。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

# 同一分支/PR 只保留最新一次构建；发布中的运行不被打断
concurrency:
  group: build-dist-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# 只在发布 dist 分支时需要写权限（PR 事件下 GITHUB_TOKEN 本身是只读的）
permissions:
  contents: write

env:
  DIST_DIR: docs/.vitepress/dist
  DIST_BRANCH: dist

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # lastUpdated 需要完整提交历史

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build VitePress site
        run: npm run docs:build

      - name: Verify build output
        run: |
          for f in index.html 404.html sitemap.xml; do
            test -f "$DIST_DIR/$f" || { echo "缺少产物: $f"; exit 1; }
          done
          # base 已改为根路径，产物中不应再出现旧的子路径
          if grep -rl '/rakcloud-docs/' "$DIST_DIR"; then
            echo "产物中仍含 /rakcloud-docs/ 路径"; exit 1
          fi

      - name: Publish to dist branch
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$DIST_DIR"
          printf 'commit=%s\nbuilt_at=%s\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > BUILD_INFO
          git init -q -b "$DIST_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "build: ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$DIST_BRANCH"
