# 测试机（无域名）用：production 监听 80，staging 监听 8080，通过端口区分。
# 正式服务器改用域名区分，见 deploy/README.md。

# staging：pull-dist.sh 拉取后自动更新，用于上线前验证
server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /var/www/staging;
    index index.html;
    error_page 404 /404.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/xml;

    # /assets/ 下文件名带内容 hash，可长期缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # HTML 不缓存，保证发布后立即生效
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/ =404;
    }
}

# production：只有 promote.sh 才会改变它指向的版本
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/production;
    index index.html;
    error_page 404 /404.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/xml;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/ =404;
    }
}
