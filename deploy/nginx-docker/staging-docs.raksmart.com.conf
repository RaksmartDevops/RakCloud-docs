# staging-docs.raksmart.com —— RakCloud 文档站（VitePress 静态站点，由 pull-dist.sh / promote.sh 管理）
# 站点根是软链接 rakcloud-docs/staging -> releases/<版本>，切换版本无需 reload Nginx。
# 放置位置：宿主机 /opt/nginx/conf.d/staging-docs.raksmart.com.conf（容器内 /etc/nginx/conf.d/）。

server {
    listen 80;
    server_name staging-docs.raksmart.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name staging-docs.raksmart.com;

    # 容器内路径；宿主机对应 /opt/nginx/html/rakcloud-docs/staging
    root /usr/share/nginx/html/rakcloud-docs/staging;
    index index.html;
    error_page 404 /404.html;

    # 复用现有泛域名证书
    ssl_certificate     /etc/nginx/ssl/STAR_raksmart_com.pem;
    ssl_certificate_key /etc/nginx/ssl/STAR_raksmart_com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 5m;
    ssl_session_cache shared:SSL:10m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # /assets/ 下文件名带内容 hash，可长期缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # HTML 不缓存，保证发布/晋升后立即生效
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/ =404;
    }
}
